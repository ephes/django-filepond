[tox]
requires = tox>=4
envlist =
    {py310,py311,py312}-django{42,52}
    py312-django61

[testenv]
package = wheel
extras = test
changedir = {envtmpdir}
setenv =
    PYTHONPATH = {envtmpdir}
    DJANGO_SETTINGS_MODULE = tests.settings
    django42: EXPECTED_DJANGO = 4.2
    django52: EXPECTED_DJANGO = 5.2
    django61: EXPECTED_DJANGO = 6.1
deps =
    django42: Django>=4.2,<4.3
    django52: Django>=5.2,<5.3
    django61: Django>=6.1,<6.2
commands_pre =
    python {toxinidir}/scripts/prepare_tests.py {envtmpdir}
commands =
    python {toxinidir}/scripts/check_distribution.py
    python -m django check --fail-level WARNING
    python -m django migrate --noinput --run-syncdb
    python -m django makemigrations --check --dry-run
    python -m pytest -c pyproject.toml --migrations --create-db --cov=filepond --cov-report=term-missing {posargs:tests}
