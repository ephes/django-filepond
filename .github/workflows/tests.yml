name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.toxenv }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python: '3.10', toxenv: py310-django42}
          - {python: '3.11', toxenv: py311-django42}
          - {python: '3.12', toxenv: py312-django42}
          - {python: '3.10', toxenv: py310-django52}
          - {python: '3.11', toxenv: py311-django52}
          - {python: '3.12', toxenv: py312-django52}
          - {python: '3.12', toxenv: py312-django61}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'tox>=4,<5'
      - run: python -m tox -e ${{ matrix.toxenv }}

  quality-and-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[dev]'
      - run: python -m black --check filepond tests testapp scripts
      - run: python -m isort --check-only filepond tests testapp scripts
      - run: python -m flake8 filepond tests testapp scripts
      - run: python -m build
      - name: Install wheel and test its resources, migrations and uploads
        run: python -m tox -e py312-django52 --recreate --installpkg dist/*.whl
      - name: Install sdist and test its resources, migrations and uploads
        run: python -m tox -e py312-django52 --recreate --installpkg dist/*.tar.gz
